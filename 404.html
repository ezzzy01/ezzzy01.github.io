<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Idham Hakim</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--page:#f7f5f0;--card:#fffefb;--ink:#2b2925;--muted:#6e6862;--accent:#b5532c;--accent-ink:#fff;--mark:#2b2925;--mark-ink:#fffefb}
@media (prefers-color-scheme:dark){:root{--page:#262523;--card:#2e2c29;--ink:#ece8e1;--muted:#a8a299;--accent:#e07b52;--accent-ink:#1f1e1c;--mark:#ece8e1;--mark-ink:#1f1e1c}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px}
main{text-align:center;max-width:460px}
.lg{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--mark);color:var(--mark-ink);font-weight:750}
h1{font-size:64px;letter-spacing:-.04em;margin:18px 0 0;line-height:1}
p{color:var(--muted);margin:12px 0 26px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="lg">IH</div>
  <h1>404</h1>
  <p>This page doesn't exist. It may have moved, or the link has a typo.</p>
  <a class="btn" href="/">Go to the home page</a>
</main>
</body>
</html>
